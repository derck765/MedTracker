plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
}

def apikeyProperties = new Properties()
def apikeyFile = rootProject.file("apikey.properties")
if (apikeyFile.exists()) {
    apikeyProperties.load(new FileInputStream(apikeyFile))
}

android {
    namespace 'com.njit.medtrack'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.njit.medtrack"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GEMINI_API_KEY", "\"${apikeyProperties.getProperty("GEMINI_API_KEY", "")}\""
    }



    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    // Unit tests (run on JVM, not bundled in app APK)
    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.arch.core.testing

    // Instrumented / integration tests (run on a device, not bundled in release APK)
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.test.core.ktx
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.kotlinx.coroutines.test
    androidTestImplementation libs.androidx.arch.core.testing
    androidTestImplementation libs.room.testing


    // Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    // WorkManager for medication reminders
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    //Gemini api
    implementation "com.google.ai.client.generativeai:generativeai:0.9.0"
}